<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApplyIQ</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M3 12L6 7L9 10L12 5" stroke="white" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-text">Apply<span class="logo-accent">IQ</span></span>
    </div>
    <span class="saved-count" id="saved-count"></span>
  </header>

  <!-- ── Form view ──────────────────────────────────────────── -->
  <div id="form-view">

    <p class="section-label">Detected job page</p>

    <!-- Error banner (hidden by default) -->
    <div id="page-error" class="error-banner hidden"></div>

    <div class="form-body">

      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" placeholder="e.g. Stripe" />
      </div>

      <div class="field">
        <label for="role">Role</label>
        <input type="text" id="role" placeholder="e.g. Software Engineer" />
      </div>

      <div class="field">
        <label>Job Link</label>
        <div class="url-display" id="url-display" title="">—</div>
      </div>

      <div class="field">
        <label>Status</label>
        <div class="status-badge">
          <span class="status-dot"></span>
          Interested
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <div class="footer">
      <button id="save-btn" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 7.5l3 3 7-7" stroke="white" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Save to ApplyIQ
      </button>
    </div>

  </div>

  <!-- ── Success view ───────────────────────────────────────── -->
  <div id="success-view" class="hidden">

    <div class="success-body">
      <div class="success-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="success-title">Job Saved!</h2>
      <p class="success-sub">
        <strong id="success-company"></strong> has been added to your ApplyIQ queue.
      </p>
      <p class="success-hint">Open ApplyIQ to review and start tracking it.</p>
    </div>

    <div class="divider"></div>

    <div class="footer">
      <button id="reset-btn" class="btn-secondary">Save Another Job</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
